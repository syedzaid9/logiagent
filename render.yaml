# ==============================================================================
# LogiAgent — Render Production Infrastructure Blueprint
# Documentation: https://render.com/docs/infrastructure-as-code
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. LogiAgent FastAPI Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: logiagent-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: "LogiAgent — AI Logistics Operations Platform"
      - key: VERSION
        value: "1.0.0"
      - key: DATABASE_URL
        fromDatabase:
          name: logiagent-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: logiagent-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://logiagent-frontend.onrender.com,http://localhost:3000,http://localhost:5173"
      - key: LLM_PROVIDER
        value: auto
      - key: EMBEDDING_MODEL_TYPE
        value: local
      - key: EMBEDDING_DIMENSION
        value: "384"
      - key: RATE_LIMIT_ENABLED
        value: "True"
      - key: GEMINI_API_KEY
        sync: false # Set securely in Render dashboard (optional: fallback engine included)
      - key: OPENAI_API_KEY
        sync: false # Set securely in Render dashboard (optional)

  # ----------------------------------------------------------------------------
  # 2. LogiAgent React + Vite + Nginx Frontend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: logiagent-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: BACKEND_URL
        value: https://logiagent-backend.onrender.com
      - key: VITE_API_BASE_URL
        value: https://logiagent-backend.onrender.com

# ------------------------------------------------------------------------------
# Managed Databases & Key-Value Stores
# ------------------------------------------------------------------------------
databases:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Database with pgvector Extension
  # ----------------------------------------------------------------------------
  - name: logiagent-postgres
    databaseName: logiagent_db
    user: logiagent
    plan: starter
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: [] # Strict internal access only

  # ----------------------------------------------------------------------------
  # Redis 7 In-Memory Cache
  # ----------------------------------------------------------------------------
  - name: logiagent-redis
    plan: starter
    region: oregon
    ipAllowList: [] # Strict internal access only
